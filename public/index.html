<!doctype html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09262d"><title>Avvero Grow-Up</title><meta name="description" content="Prezentările Avvero într-un singur loc."><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"><link rel="stylesheet" href="/styles.css"></head><body id="drop"><header><img src="/logo.png" alt="Avvero"><button class="upload-button" id="choose" title="Adaugă o prezentare"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 16V3m-4 4 4-4 4 4M4 16v5h16v-5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Adaugă</span></button><input type="file" accept=".html,.htm,text/html" id="file" hidden></header><main><div class="top"><div><p class="eyebrow">AVVERO</p><h1>Grow<span>-Up</span></h1></div></div><div class="workspace"><section aria-labelledby="list-title"><h2 id="list-title">Alege o prezentare</h2><div class="cards" id="cards"><p class="loading">Se încarcă prezentările...</p></div></section></div><p class="status" id="status" role="status" aria-live="polite"></p><footer><span>Avvero Grow-Up</span><span class="counter" id="count">0 prezentări</span></footer></main><dialog id="dialog" aria-labelledby="dialog-title"><form id="form"><h2 id="dialog-title">Noua prezentare</h2><label for="title">Titlul prezentării</label><input id="title" maxlength="120" required autocomplete="off"><p id="filename"></p><div id="password-group" hidden><label for="password">Parola pentru încărcare</label><input type="password" id="password" autocomplete="current-password"></div><p class="dialog-error" id="dialog-error" role="alert"></p><div class="actions"><button type="button" class="secondary" id="cancel">Anulează</button><button type="submit" class="primary" id="save">Adaugă prezentarea</button></div></form></dialog><dialog id="delete-dialog" aria-labelledby="delete-heading"><form id="delete-form"><h2 id="delete-heading">Șterge prezentarea</h2><p id="delete-title"></p><p>Prezentarea va fi eliminată definitiv.</p><label for="delete-password">Parola pentru administrare</label><input type="password" id="delete-password" autocomplete="current-password" required><p id="delete-error" class="dialog-error" role="alert"></p><div class="actions"><button type="button" class="secondary" id="delete-cancel">Anulează</button><button type="submit" class="danger" id="delete-save">Șterge prezentarea</button></div></form></dialog><section id="viewer" hidden aria-label="Prezentare"><div class="viewer-bar"><button id="back" class="secondary">← Înapoi la prezentări</button><span id="viewer-title"></span></div><p id="viewer-status" role="status">Se încarcă prezentarea...</p><iframe id="frame" title="Prezentare" sandbox="allow-scripts allow-popups allow-downloads" allowfullscreen></iframe></section><script src="/app.js" defer></script></body></html>
